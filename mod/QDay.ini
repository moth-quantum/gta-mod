; Q-DAY settings. Copy next to QDay.dll as GTAV\scripts\QDay.ini, then reload scripts in game.

[General]
; true enables the playtest keys: F3 road switching test on the last test wall (Shift+F3 stop, Ctrl+F3 read nodes),
; F4 force field test wall ahead, F5 teleport to the objective, F6 skip the pending Atlas wait
; (uses the recorded result), F7 jump straight to Q-Day, F8 teleport to Legion Square,
; F9 start the mission from anywhere.
; Every use is logged to scripts\QDay.log. Leave false for recordings and release.
Debug = false
; true hides the GPS route line during the escape and keeps the stop blip. Only read when Debug is true.
HideEscapeRoute = false

[Atlas]
; Moth Atlas API key. Leave empty to play offline from the recorded real results.
ApiKey =
; true forces offline mode even with a key set.
Offline = false
